<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1c0e0a" />
    <meta name="description" content="Vinayaka Chaturthi Invitation — Penumuli Perantalamma Youth. September 14th." />
    <title>Vinayaka Chaturthi Invitation · Penumuli Perantalamma Youth</title>
    <link rel="preload" as="image" href="assets/frame-01-temple-exterior.jpeg" fetchpriority="high" />
    <link rel="preload" as="image" href="assets/frame-03-doors-closed.jpeg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Outfit:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/experience.css" />
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
    <script>
      window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#approach">Skip to invitation</a>

    <div class="loader" id="loader">
      <img src="assets/frame-01-temple-exterior.jpeg" alt="" />
    </div>

    <div class="phone-preview-wrap" id="phonePreviewWrap" hidden>
      <p class="phone-preview-note">Designed for a phone. Scroll inside the screen.</p>
      <iframe class="phone-preview" id="phonePreview" title="Vinayaka Chaturthi invitation" allow="autoplay"></iframe>
    </div>

    <button class="auto-scroll-toggle" id="autoScrollToggle" type="button" aria-pressed="false" aria-label="Auto play experience">
      <span class="auto-glyph" aria-hidden="true">▶</span>
      <span class="auto-label">Auto Play</span>
    </button>

    <button class="music-toggle" id="musicToggle" type="button" aria-pressed="false" aria-label="Play music">
      <span class="music-glyph" aria-hidden="true">♪</span>
      <span class="music-label">Play music</span>
    </button>

    <div class="interactive-guide-bubble" id="guideBubble" aria-live="polite" hidden>
      <span class="guide-icon">✨</span>
      <span class="guide-text" id="guideText">Tap the doors to enter</span>
    </div>

    <main>
      <section class="chapter" id="approach" aria-label="Approach the temple">
        <div class="frame" id="approachFrame">
          <img class="shot is-wide" src="assets/frame-01-temple-exterior.jpeg" alt="Temple exterior at sunset." fetchpriority="high" />
          <img class="shot is-entrance" src="assets/frame-02-temple-entrance.jpeg" alt="" />
        </div>
      </section>

      <section class="chapter" id="doors" aria-label="Temple doors">
        <div class="frame door-stage">
          <img class="shot door-beyond" src="assets/frame-05-blue-temple-title.jpeg" alt="Vinayaka Chaturthi invitation title." />
          <div class="door-pair" id="doorPair">
            <button class="door-leaf door-left" id="doorLeft" type="button" aria-label="Open the temple door">
              <span class="door-face"><img src="assets/frame-03-doors-closed.jpeg" alt="" /></span>
            </button>
            <button class="door-leaf door-right" id="doorRight" type="button" aria-label="Open the temple door">
              <span class="door-face"><img src="assets/frame-03-doors-closed.jpeg" alt="" /></span>
            </button>
          </div>
          <p class="door-hint" id="doorHint">Tap the doors to enter</p>
        </div>
      </section>

      <section class="chapter" id="invitation" aria-label="Invitation booklet">
        <div class="frame booklet">
          <div class="booklet-page" id="bookletPage">
            <div class="page-face">
              <img src="assets/frame-06-english-invitation.jpeg" alt="English Vinayaka Chaturthi invitation." />
            </div>
            <div class="page-face page-back">
              <img src="assets/frame-07-telugu-invitation.jpeg" alt="Telugu Vinayaka Chaturthi invitation." />
            </div>
          </div>
        </div>
      </section>

      <section class="chapter" id="story" aria-label="More than a celebration">
        <div class="frame poster">
          <div class="poster-fit">
            <img class="shot" src="assets/frame-08-more-than-celebration.jpeg" alt="More Than a Celebration." />
          </div>
        </div>
      </section>

      <section class="chapter" id="countdown" aria-label="Counting the days">
        <div class="frame poster" id="countPoster">
          <div class="poster-fit">
            <img class="shot" src="assets/frame-09-counting-days.jpeg" alt="Counting the Days." />
            <div class="live-timer" id="timer" aria-live="polite">
              <div class="unit">
                <span data-unit="days">00</span>
                <small>Days</small>
              </div>
              <i aria-hidden="true">+</i>
              <div class="unit">
                <span data-unit="hours">00</span>
                <small>Hours</small>
              </div>
              <i aria-hidden="true">+</i>
              <div class="unit">
                <span data-unit="minutes">00</span>
                <small>Minutes</small>
              </div>
              <i aria-hidden="true">+</i>
              <div class="unit">
                <span data-unit="seconds">00</span>
                <small>Seconds</small>
              </div>
            </div>
            <button class="magic-hot" id="magicBtn" type="button" aria-label="Ring the temple bell">
              <span class="bell-mark" aria-hidden="true">
                <svg viewBox="0 0 48 48" fill="none">
                  <path d="M24 6.5c-1.2 0-2.2.9-2.4 2.1-.7 3.6-6.1 7.4-6.1 14.2 0 4.4-1.6 6.8-2.9 8.2-.6.6-.3 1.7.5 1.7h21.8c.8 0 1.1-1.1.5-1.7-1.3-1.4-2.9-3.8-2.9-8.2 0-6.8-5.4-10.6-6.1-14.2-.2-1.2-1.2-2.1-2.4-2.1Z" fill="#d4b36a" stroke="#8a5a22" stroke-width="1.4"/>
                  <path d="M18.2 34.2c1.4 2.8 3.4 4.3 5.8 4.3s4.4-1.5 5.8-4.3" stroke="#8a5a22" stroke-width="1.5" stroke-linecap="round"/>
                  <circle cx="24" cy="38.6" r="2.1" fill="#c6a15a" stroke="#8a5a22" stroke-width="1.2"/>
                  <path d="M24 6.5V4.8" stroke="#8a5a22" stroke-width="1.6" stroke-linecap="round"/>
                  <path d="M20.5 8.2h7" stroke="#8a5a22" stroke-width="1.4" stroke-linecap="round"/>
                </svg>
              </span>
            </button>
          </div>
        </div>
      </section>

      <section class="chapter" id="blessing" aria-label="Divine blessing">
        <div class="frame poster bless-stage">
          <div class="poster-fit">
            <img class="shot bless is-logo" src="assets/frame-10-logo-reveal.jpeg" alt="Penumuli Perantalamma Youth emblem." />
            <img class="shot bless is-glow" src="assets/frame-11-illuminated-ganapati.jpeg" alt="Illuminated Ganapati blessing." />
            <img class="shot bless is-rays" src="assets/frame-13-golden-rays.jpeg" alt="Golden rays blessing." />
          </div>
        </div>
      </section>

      <section class="chapter" id="donation" aria-label="Donation">
        <div class="frame poster donation-stage">
          <div class="poster-fit">
            <img class="shot donation-shot" src="assets/frame-14-donation-qr.jpeg" alt="Donation page with QR code." />
            <button class="upi-hotspot qr-hotspot" id="upiQrBtn" type="button" aria-label="Copy UPI ID for donation" title="Tap to copy UPI ID (9849590408-1@okbizaxis)">
              <span class="upi-badge">Tap to Copy ID</span>
            </button>
            <button class="upi-hotspot number-hotspot" id="upiNumberBtn" type="button" aria-label="Copy Phone number 9849590408 for donation" title="Tap to copy Phone Number (9849590408)">
              <span class="upi-badge upi-badge-sm">Tap to Copy No.</span>
            </button>
            <button class="exit-btn" id="exitBtn" type="button">Exit</button>

            <div class="upi-toast" id="upiToast" aria-live="polite" hidden>Copied to clipboard!</div>
          </div>
        </div>
      </section>
    </main>

    <audio id="bgm" src="audio/devotional-music.mp3" loop preload="none"></audio>
    <audio id="bell" src="audio/temple-bell.mp3" preload="auto"></audio>

    <script src="vendor/gsap.min.js"></script>
    <script src="vendor/ScrollTrigger.min.js"></script>
    <script src="vendor/lenis.min.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/countdown.js"></script>
    <script src="js/experience.js"></script>
  </body>
</html>
